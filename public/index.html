<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دروب — متجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://js.stripe.com/v3/"></script>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">د</div>
      <div><div class="brand-name">دروب</div><div class="brand-sub">متجرك، بلا مخزون</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <a class="navlink" href="/ops.html">غرفة التشغيل</a>
      <button class="cart-btn" onclick="openCart()">🛒 السلة <span class="cart-count" id="cartCount">0</span></button>
    </div>
  </div>

  <p class="hero-title">منتجات منتقاة، تشحن من المورد مباشرة لعتبة بيتك</p>
  <p class="hero-sub">كل طلبية بتدفعها هون بترسل أوتوماتيك للمورد، وربحك بيتحسب لحظياً بصفحة "غرفة التشغيل".</p>

  <div class="grid" id="productGrid"></div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeCart()">
  <div class="drawer">
    <div class="drawer-head"><h3 style="margin:0;">سلتك</h3><button class="close-x" onclick="closeCart()">✕</button></div>
    <div id="cartItems"></div>
    <div class="cart-total"><span>الإجمالي</span><span id="cartTotal">0</span></div>
    <button class="checkout-btn" id="checkoutBtn" onclick="checkout()" disabled>ادفع الآن</button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
